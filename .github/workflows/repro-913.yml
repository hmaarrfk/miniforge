name: repro-913
on:
  push:
    branches:
      - repro-913
  workflow_dispatch:

jobs:
  repro:
    name: ${{ matrix.version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        version: ["26.9.4-0", "26.7.2-1"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Download and install
        run: |
          curl -fsSL -o mf.exe "https://github.com/conda-forge/miniforge/releases/download/${{ matrix.version }}/Miniforge3-${{ matrix.version }}-Windows-x86_64.exe"
          echo "start /wait \"\" mf.exe /InstallationType=JustMe /RegisterPython=0 /AddToPath=0 /S /D=$(cygpath -w "$HOME/mf")" > install.bat
          cmd.exe //c install.bat
          ls "$HOME/mf"

      - name: Inspect conda-meta paths_data
        run: |
          "$HOME/mf/python.exe" -I -c "
          import glob, json, os
          empty = []; total = 0
          for f in sorted(glob.glob(os.path.expanduser('~/mf/conda-meta/*.json'))):
              d = json.load(open(f)); total += 1
              n_files = len(d.get('files', []))
              n_paths = len((d.get('paths_data') or {}).get('paths', []))
              if n_files and n_paths < n_files:
                  empty.append((d['name'], n_files, n_paths))
              if d['name'] in ('conda-launchers', 'conda', 'conda-standalone'):
                  print(d['name'], d['version'], d['build'], 'files=', n_files, 'paths_data=', n_paths)
          print(f'{len(empty)}/{total} records have fewer paths_data entries than files:')
          for e in empty: print('  ', *e)
          "
          echo "--- installer conda-exe:"
          "$HOME/mf/_conda.exe" --version || true
          head -c 600 "$HOME/mf/conda-meta/history" || true

      - name: conda init --all --dry-run (non-mutating)
        run: |
          set +e
          cmd.exe //c "$(cygpath -w "$HOME/mf/condabin/conda.bat") init --all --dry-run -v"
          echo "exit=$?"

      - name: conda init --all
        run: |
          set +e
          cmd.exe //c "$(cygpath -w "$HOME/mf/condabin/conda.bat") init --all -v"
          echo "exit=$?" | tee init_exit.txt

      - name: conda create with entry points
        run: |
          set +e
          cmd.exe //c "$(cygpath -w "$HOME/mf/condabin/conda.bat") create -n t -y -q pytest"
          echo "exit=$?"

      - name: Workaround - force-reinstall conda-launchers with safety checks on
        run: |
          set +e
          CONDA_SAFETY_CHECKS=warn cmd.exe //c "$(cygpath -w "$HOME/mf/condabin/conda.bat") install -n base --force-reinstall -y -q conda-launchers"
          "$HOME/mf/python.exe" -I -c "
          import glob, json, os
          f = glob.glob(os.path.expanduser('~/mf/conda-meta/conda-launchers-*.json'))[0]
          print(f, len(json.load(open(f))['paths_data']['paths']))
          "
          cmd.exe //c "$(cygpath -w "$HOME/mf/condabin/conda.bat") init --all"
          echo "init exit after workaround=$?"

  candidate:
    name: candidate ${{ matrix.fix }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        fix: [offline-reinstall, json-repair]
    defaults:
      run:
        shell: bash
    steps:
      - name: Download and install 26.9.4-0
        run: |
          curl -fsSL -o mf.exe "https://github.com/conda-forge/miniforge/releases/download/26.9.4-0/Miniforge3-26.9.4-0-Windows-x86_64.exe"
          echo "start /wait \"\" mf.exe /InstallationType=JustMe /RegisterPython=0 /AddToPath=0 /S /D=$(cygpath -w "$HOME/mf")" > install.bat
          cmd.exe //c install.bat
          ls "$HOME/mf/pkgs" | grep -i launchers

      - name: Apply offline-reinstall (installer env vars, no network)
        if: matrix.fix == 'offline-reinstall'
        run: |
          set +e
          CONDA_SAFETY_CHECKS=disabled CONDA_OFFLINE=true CONDA_PKGS_DIRS="$(cygpath -w "$HOME/mf/pkgs")" \
            "$HOME/mf/python.exe" -m conda install -p "$(cygpath -w "$HOME/mf")" --offline --force-reinstall --no-deps -y conda-launchers
          echo "exit=$?"
          tail -5 "$HOME/mf/conda-meta/history"

      - name: Apply json-repair
        if: matrix.fix == 'json-repair'
        run: |
          "$HOME/mf/python.exe" -I -c "import glob, json, os, sys; [json.dump(dict(r, paths_data={'paths_version': 1, 'paths': json.load(open(os.path.join(r['extracted_package_dir'], 'info', 'paths.json')))['paths']}), open(m, 'w'), indent=2, sort_keys=True) for m in glob.glob(os.path.join(sys.prefix, 'conda-meta', 'conda-launchers-*.json')) for r in [json.load(open(m))] if not r['paths_data']['paths']]"

      - name: Check
        run: |
          "$HOME/mf/python.exe" -I -c "
          import glob, json, os
          f = glob.glob(os.path.expanduser('~/mf/conda-meta/conda-launchers-*.json'))[0]
          d = json.load(open(f)); print(f, d['channel'], len(d['paths_data']['paths'])); print(json.dumps(d['paths_data']['paths'][:2], indent=1))
          "
          cmd.exe //c "$(cygpath -w "$HOME/mf/condabin/conda.bat") init --all --dry-run"
          cmd.exe //c "$(cygpath -w "$HOME/mf/condabin/conda.bat") init --all"
          cmd.exe //c "$(cygpath -w "$HOME/mf/condabin/conda.bat") create -n t -y -q pytest"
          ls "$HOME/mf/envs/t/Scripts/" | grep -i pytest
          cmd.exe //c "$(cygpath -w "$HOME/mf/condabin/conda.bat") list -n base conda-launchers"
